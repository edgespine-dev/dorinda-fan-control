; Dorinda fan control — PlatformIO root
; From repo root:  make test1 | make test2

[platformio]
default_envs = test1
src_dir = ${sysenv.DFC_SRC}

[env]
lib_extra_dirs =
    lib
    ../vendor/bakerbug-firmware/firmware/lib

[env:test1]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    drivers
    hw
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

[env:test2]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_extra_dirs =
    lib
    ../vendor/bakerbug-firmware/firmware/bsp
    ../vendor/bakerbug-firmware/firmware/lib
build_flags =
    -DSERIAL_DEBUG
    -I include
    -I ../vendor/bakerbug-firmware/firmware/bsp/include
lib_deps =
    ../vendor/bakerbug-firmware/firmware/bsp/esp8266
    dfc_wifi
    drivers
    hw
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    ottowinter/ESPAsyncWebServer-esphome@^3.1.0

[env:test3]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs
lib_extra_dirs =
    lib
    ../vendor/bakerbug-firmware/firmware/bsp
    ../vendor/bakerbug-firmware/firmware/lib
build_flags =
    -DSERIAL_DEBUG
    -I include
    -I ../vendor/bakerbug-firmware/firmware/bsp/include
lib_deps =
    ../vendor/bakerbug-firmware/firmware/bsp/esp8266
    dfc_wifi
    drivers
    hw
    cal_matrix
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    bblanchon/ArduinoJson@^7.2.0
    ottowinter/ESPAsyncWebServer-esphome@^3.1.0

[env:main]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_extra_dirs =
    lib
    ../vendor/bakerbug-firmware/firmware/bsp
    ../vendor/bakerbug-firmware/firmware/lib
build_flags =
    -DSERIAL_DEBUG
    -I include
    -I ../vendor/bakerbug-firmware/firmware/bsp/include
lib_deps =
    ../vendor/bakerbug-firmware/firmware/bsp/esp8266
    dfc_wifi
    drivers
    hw
    control
    cal_matrix
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    bblanchon/ArduinoJson@^7.2.0
    ottowinter/ESPAsyncWebServer-esphome@^3.1.0
